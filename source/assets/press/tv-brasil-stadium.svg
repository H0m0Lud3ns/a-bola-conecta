<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- barra do navegador -->
  <rect x="0" y="0" width="800" height="36" fill="#e8e8e8"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c940"/>
  <rect x="100" y="10" width="500" height="16" rx="8" fill="#ffffff" stroke="#cccccc"/>
  <text x="350" y="22" text-anchor="middle" font-family="Arial" font-size="11" fill="#999">tvbrasil.com.br</text>

  <!-- header do site -->
  <rect x="0" y="36" width="800" height="64" fill="#005c83"/>
  <text x="40" y="76" font-family="Georgia" font-size="26" font-weight="bold" fill="#ffffff">TV Brasil</text>

  <!-- kicker -->
  <rect x="40" y="124" width="80" height="22" fill="#005c83" opacity="0.15"/>
  <text x="80" y="140" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#005c83" letter-spacing="1">ESPORTE</text>

  <!-- headline -->
  <foreignObject x="40" y="170" width="720" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 32px; font-weight: 700; line-height: 1.15; color: #111;">
      Stadium comeca com uma historia nota 10
    </div>
  </foreignObject>

  <!-- imagem placeholder -->
  <rect x="40" y="290" width="720" height="180" fill="#f0f0f0" stroke="#ddd"/>
  <text x="400" y="390" text-anchor="middle" font-family="Arial" font-size="14" fill="#999">[ imagem da materia ]</text>
</svg>